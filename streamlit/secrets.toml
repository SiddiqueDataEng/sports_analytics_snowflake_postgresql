# ── Snowflake connection ──────────────────────────────────────────────────────
# Add these in Streamlit Cloud → App Settings → Secrets

[snowflake]
account   = "your-account-identifier"   # e.g. abc12345.us-east-1.aws
user      = "your-username"
role      = "SPORTZONE_DATA_ENG"
warehouse = "COMPUTE_WH"
database  = "SPORTZONE_DEV"
schema    = "WAREHOUSE"
password  = "your-password"             # OR use private_key below

# private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"

# ── Neon PostgreSQL ──────────────────────────────────────────────────────────
[neon]
connection_string = "postgresql://user:pass@host/db?sslmode=require"

# ── OpenAI (optional) ────────────────────────────────────────────────────────
[openai]
api_key = "sk-..."
